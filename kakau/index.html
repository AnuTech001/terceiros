<!DOCTYPE html>
<html lang="pt-BR">
  	<head>
    		<meta charset="UTF-8">
    		<meta name="viewport" content="width=device-width, initial-scale=1.0">
			<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"/>
    		<link rel="stylesheet" href="assets/css/style.css">
			<link rel="icon" href="assets/images/logo.png"/>
			<base href="./kakau"/>
    		<title>Blog</title>
  	</head>
	<body>
    	<header>
		<img src="./assets/images/logo.png" 
		alt="Logotipo circular de tecnologia com microchip central e circuitos em azul e cinza."/>
		<h1>BLOG DA KAUH</h1>
		<p>Por Kauane K. M. Souza</p>
    	</header>
    	<main>
		<section id="audio">
			<div class="painel-musica">
				<div class="player">
					<span class="material-icons-outlined">
						music_note
					</span>
					<div class="controles">
						<button id="parar" class="btn-stop" aria-label="Parar">
							<span class="material-icons-outlined">stop</span>
						</button>
						<button id="tocar" class="btn-play" aria-label="Tocar">
							<span class="material-icons-outlined">play_arrow</span>
						</button>
						<button id="pausar" class="btn-pause" aria-label=Pausar>
							<span class="material-icons-outlined">pause</span>
						</button>
						<audio id="musica" src="./assets/audio/lisboa.mp3"></audio>
					</div>
				</div>
			</div>
		</section>
      		<section id="inicio-do-conteudo">
        	<div class="conteudo">
          		<div class="titulo">
				<h2>Boas-vindas ao meu <em>blog</em>!</h2>
          		</div>
          		<p>Aqui vou compatilhar dicas de programação, experiências e curiosidades.</p>
			<hr/>	
		</div>
    	  	</section>
		<footer>
			<p>v1.0.2</p>
			<p class="aviso-mobile">Para uma melhor experiência gráfica, use um computador</p>
		</footer>
    	</main>
	<script src="./assets/js/script.js"></script>
    	<div vw class="enabled">
      	<div vw-access-button class="active"></div>
      	<div vw-plugin-wrapper>
        	<div class="vw-plugin-top-wrapper"></div>
      	</div>
    	</div>
    	<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    	<script>
      		new window.VLibras.Widget("https://vlibras.gov.br/app");
    	</script>
  	</body>
</html>
